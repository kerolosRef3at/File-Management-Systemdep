<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>KERNEL PANIC - EGC File System</title>
    <link rel="icon" type="image/png" href="logos/logo.png">

    <link rel="stylesheet" href="css/login.css?v=20260922_v800">

    <style>
        .lp-hero,
        .lp-veil {
            display: none !important;
        }

        .lp-brand-name,
        .lp-brand-sub,
        .lp-card-name,
        .lp-card-sub {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif !important;
        }

        .lp-card {
            width: 410px !important;
            max-width: 90vw !important;
            max-height: 92vh !important;
            background: #FFFFFF !important;
            border: 1px solid rgba(226, 232, 240, 0.7) !important;
            border-radius: 30px !important;
            padding: 38px 34px 34px !important;
            box-shadow: 0 22px 60px rgba(15, 35, 80, 0.12), 0 6px 20px rgba(15, 35, 80, 0.05) !important;
            text-align: center !important;
            display: flex !important;
            flex-direction: column !important;
            overflow-y: auto !important;
        }

        .lp-brand-logo {
            width: 96px !important;
            height: 96px !important;
            border-radius: 50% !important;
            object-fit: contain !important;
            display: block !important;
            padding: 4px !important;
            box-sizing: border-box !important;
            background: #ffffff !important;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.1) !important;
            flex-shrink: 0 !important;
        }

        .lp-brand-name {
            font-size: 32px !important;
            font-weight: 800 !important;
            line-height: 1.2 !important;
            letter-spacing: 0.5px !important;
        }

        .lp-brand-sub {
            font-size: 16px !important;
            font-weight: 700 !important;
            color: #8899AC !important;
            letter-spacing: 3px !important;
            text-transform: uppercase !important;
            margin-top: 4px !important;
        }

        .lp-card-logo {
            width: 96px !important;
            height: 96px !important;
            border-radius: 50% !important;
            object-fit: contain !important;
            display: block !important;
            margin: 0 auto 14px !important;
            padding: 8px !important;
            box-sizing: border-box !important;
            background: #ffffff !important;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.09) !important;
        }

        .lp-card-name {
            font-size: 27px !important;
            font-weight: 800 !important;
            line-height: 1.2 !important;
            letter-spacing: 0.5px !important;
        }

        .lp-card-sub,
        [dir="rtl"] .lp-card-sub,
        html[dir="rtl"] .lp-card-sub {
            font-size: 13.5px !important;
            font-weight: 700 !important;
            color: #94A3B8 !important;
            letter-spacing: 2.5px !important;
            text-transform: uppercase !important;
            margin-top: 4px !important;
            line-height: 1.4 !important;
        }

        .lp-card-rule {
            width: 36px !important;
            height: 4px !important;
            background: #0066ff !important;
            border-radius: 4px !important;
            margin: 12px auto 20px !important;
        }
    </style>

    <script>
        // Apply saved language instantly
        (function() {
            var lang = localStorage.getItem('aitu_lang') || 'ar';
            var dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.setAttribute('dir', dir);
            document.documentElement.setAttribute('lang', lang);
        })();
    </script>
</head>
<body>
    <div class="lp-root" id="lpRoot" dir="rtl">
        <!-- Background Layer with baked-in soft curve -->
        <div class="lp-bg" id="lpBg" style="background-image: url('background.png?v=20260922_3');"></div>

        <!-- Readability Veil -->
        <div class="lp-veil"></div>

        <!-- Header -->
        <header class="lp-header">
            <div class="lp-brand">
                <img src="logos/logo.png?v=20260922_6" alt="KERNEL PANIC" class="lp-brand-logo" onerror="this.src='logos/kp_icon.png'">
                <div class="lp-brand-text">
                    <div class="lp-brand-name" id="lpBrandName"><span style="color:#000000; font-weight:800;">KERNEL</span> <span style="color:#0066ff; font-weight:800;">PANIC</span></div>
                    <div class="lp-brand-sub" id="lpBrandSub">IT TEAM</div>
                </div>
            </div>

            <button class="lp-lang" id="lpLangBtn" type="button" aria-label="Switch Language">
                <span class="lp-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M2 12h20"/>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                </span>
                <span class="lp-lang-label" id="lpLangLabel">English</span>
                <span class="lp-icon lp-chev">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </span>
            </button>
        </header>



        <!-- Login Card Zone (Positioned over soft curve) -->
        <div class="lp-card-zone">
            <div class="lp-card">
                <img src="logos/logo.png?v=20260922_4" alt="KERNEL PANIC" class="lp-card-logo" onerror="this.src='logos/kp_icon.png'">

                <div class="lp-card-name" id="lpCardName"><span style="color:#000000; font-weight:800;">KERNEL</span> <span style="color:#0066ff; font-weight:800;">PANIC</span></div>
                <div class="lp-card-sub" id="lpCardSub">IT TEAM</div>

                <div class="lp-card-rule"></div>

                <!-- Mode 1: Login Form -->
                <form class="lp-form" id="loginForm">
                    <div class="input-field-group">
                        <div class="input-wrapper">
                            <span class="input-left-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                            </span>
                            <input 
                                type="text" 
                                id="username" 
                                class="lp-input" 
                                placeholder="اسم المستخدم أو البريد الإلكتروني" 
                                required 
                                autocomplete="username"
                            >
                        </div>
                    </div>

                    <div class="input-field-group">
                        <div class="input-wrapper">
                            <span class="input-left-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="4" y="11" width="16" height="10" rx="2"/>
                                    <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                                </svg>
                            </span>
                            <input 
                                type="password" 
                                id="password" 
                                class="lp-input" 
                                placeholder="كلمة المرور" 
                                required 
                                autocomplete="current-password"
                            >
                            <button type="button" class="lp-pw-toggle" id="togglePasswordBtn" aria-label="Toggle Password Visibility">
                                <span class="lp-pw-icon">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                </span>
                                <span class="lp-pw-text">إظهار</span>
                            </button>
                        </div>
                    </div>

                    <div class="lp-row">
                        <label class="lp-remember">
                            <input type="checkbox" id="rememberMe" checked>
                            <span id="lpRememberLabel">تذكرني</span>
                        </label>
                        <button type="button" class="lp-link" id="lpForgotBtn">نسيت كلمة المرور؟</button>
                    </div>

                    <div id="errorMessage" class="lp-alert lp-alert-error" style="display:none;"></div>

                    <button type="submit" class="lp-btn-primary" id="submitBtn">
                        <span id="btnText">تسجيل الدخول</span>
                        <span class="lp-btn-arrow" id="lpBtnArrow">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="19" y1="12" x2="5" y2="12" />
                                <polyline points="12 19 5 12 12 5" />
                            </svg>
                        </span>
                    </button>
                </form>

                <!-- Mode 2: Forgot Password - Send OTP Form -->
                <form class="lp-form" id="forgotEmailForm" style="display: none;">
                    <p class="lp-hint" id="fpHint">
                        أدخل بريدك الإلكتروني وسنرسل لك رمز تحقق لإعادة تعيين كلمة المرور.
                    </p>
                    <div class="input-field-group">
                        <div class="input-wrapper">
                            <span class="input-left-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                            </span>
                            <input 
                                type="email" 
                                id="fpEmail" 
                                class="lp-input" 
                                placeholder="البريد الإلكتروني" 
                                required 
                                dir="ltr"
                            >
                        </div>
                    </div>

                    <div id="fpEmailError" class="lp-alert lp-alert-error" style="display:none;"></div>

                    <button type="submit" class="lp-btn-primary" id="sendOtpBtn">
                        <span id="sendOtpBtnText">إرسال رمز التحقق</span>
                    </button>

                    <button type="button" class="lp-btn-ghost" id="backToLoginBtn1">
                        <span id="backToLoginText1">→ رجوع لتسجيل الدخول</span>
                    </button>
                </form>

                <!-- Mode 3: Forgot Password - Reset Password Form -->
                <form class="lp-form" id="forgotResetForm" style="display: none;">
                    <div id="fpInfoAlert" class="lp-alert lp-alert-success" style="display:none;"></div>

                    <div class="input-field-group">
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="fpOtp" 
                                class="lp-input" 
                                placeholder="رمز التحقق (6 أرقام)" 
                                maxlength="6" 
                                dir="ltr"
                                style="text-align: center; letter-spacing: 8px; font-size: 20px; font-weight: 800; padding: 9px 13px;"
                                required
                            >
                        </div>
                    </div>

                    <div class="input-field-group">
                        <div class="input-wrapper">
                            <span class="input-left-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="4" y="11" width="16" height="10" rx="2"/>
                                    <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                                </svg>
                            </span>
                            <input 
                                type="password" 
                                id="fpNewPassword" 
                                class="lp-input" 
                                placeholder="كلمة المرور الجديدة" 
                                required 
                                minlength="6"
                                dir="ltr"
                            >
                            <button type="button" class="lp-pw-toggle" id="toggleFpNewPasswordBtn" aria-label="Toggle Password Visibility">
                                <span class="lp-pw-icon">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                </span>
                                <span class="lp-pw-text">إظهار</span>
                            </button>
                        </div>
                    </div>

                    <div class="input-field-group">
                        <div class="input-wrapper">
                            <span class="input-left-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="4" y="11" width="16" height="10" rx="2"/>
                                    <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                                </svg>
                            </span>
                            <input 
                                type="password" 
                                id="fpConfirmPassword" 
                                class="lp-input" 
                                placeholder="تأكيد كلمة المرور" 
                                required 
                                minlength="6"
                                dir="ltr"
                            >
                            <button type="button" class="lp-pw-toggle" id="toggleFpConfirmPasswordBtn" aria-label="Toggle Password Visibility">
                                <span class="lp-pw-icon">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                </span>
                                <span class="lp-pw-text">إظهار</span>
                            </button>
                        </div>
                    </div>

                    <div id="fpResetError" class="lp-alert lp-alert-error" style="display:none;"></div>

                    <button type="submit" class="lp-btn-primary" id="resetPasswordBtn">
                        <span id="resetPasswordBtnText">حفظ كلمة المرور الجديدة</span>
                    </button>

                    <button type="button" class="lp-btn-ghost" id="backToLoginBtn2">
                        <span id="backToLoginText2">→ رجوع لتسجيل الدخول</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="js/pages/login.js"></script>
</body>
</html>
