<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>بوابة أعضاء هيئة التدريس والهيئة المعاونة - جامعة أسيوط التكنولوجية الدولية</title>
    <meta name="description"
        content="بوابة الدكاترة والمعيدين لرفع وإتاحة الماتريال والمحاضرات، شيتات التكليفات والواجبات، والكتب والمراجع الأكاديمية لطلاب جامعة أسيوط التكنولوجية الدولية.">
    <link rel="icon" type="image/png" href="logos/logo.png">

    <link rel="stylesheet" href="css/app-shell.css?v=24">
    <link rel="stylesheet" href="css/style.css?v=24">
    <link rel="stylesheet" href="css/components.css?v=24">
    <link rel="stylesheet" href="css/rtl.css?v=24">
    <link rel="stylesheet" href="css/faculty-materials.css?v=24">

    <script>
        (function () {
            var lang = localStorage.getItem('aitu_lang') || 'ar';
            document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.documentElement.setAttribute('lang', lang);
        })();
    </script>
</head>

<body>
    <!-- App Shell Mount Point -->
    <div id="app"></div>

    <script type="module" src="js/shared/router.js?v=24"></script>
    <script type="module">
        import { renderLayout } from './js/shared/layout.js';
        import { initFacultyMaterials } from './js/pages/faculty-materials.js';
        import { initLanguage } from './js/shared/jssharedi18n.js';

        document.addEventListener('DOMContentLoaded', async () => {
            initLanguage();
            renderLayout('faculty-materials');
            const pageContent = document.getElementById('page-content');
            await initFacultyMaterials(pageContent || document.getElementById('app'));
        });
    </script>
</body>

</html>
